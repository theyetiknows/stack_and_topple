name: stack_and_topple
description: "Stack & Topple — a hyper-casual stacking game (V1 MVP)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 2D game engine: game loop, canvas, overlays.
  flame: ^1.37.0
  # Accelerometer stream for Balance Mode tilt (native platforms).
  sensors_plus: ^7.0.0
  # Persisted settings toggles (Balance Mode, Haptics).
  shared_preferences: ^2.3.0
  # Browser DeviceMotion bindings so Balance Mode also works on the web build
  # (including the iOS Safari motion-permission flow).
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

# NOTE: the record/share increment adds — camera + flutter_screen_recording +
# share_plus + permission_handler. Deliberately not added until that increment.
